<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1115;color:#e6e6e6;font:16px/1.4 -apple-system,system-ui,sans-serif}
  main{width:min(720px,92vw)}
  h1{font-weight:600;letter-spacing:-.02em;margin:0 0 1.5rem}
  ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  a{display:block;padding:16px 18px;border-radius:12px;background:#181b22;border:1px solid #242833;color:inherit;text-decoration:none}
  a:hover{border-color:#aa5cc3}
  b{display:block;font-size:1.05rem}
  span{color:#8b93a3;font-size:.875rem}
  .hint{color:#5c6370;font-size:.8rem;margin-top:1.5rem}
  .main{background:linear-gradient(135deg,#aa5cc333,#00a4dc33)}
</style>
</head>
<body><main>
<h1>Media</h1>
<ul>
  <li><a class="main" href="http://jellyfin.lan" data-port="8096"><b>Jellyfin</b><span>Assistir</span></a></li>
  <li><a class="main" href="http://seerr.lan" data-port="5055"><b>Pedidos</b><span>Pedir filmes e séries</span></a></li>
  <li><a href="http://sonarr.lan" data-port="8989"><b>Sonarr</b><span>Séries</span></a></li>
  <li><a href="http://radarr.lan" data-port="7878"><b>Radarr</b><span>Filmes</span></a></li>
  <li><a href="http://lidarr.lan" data-port="8686"><b>Lidarr</b><span>Música</span></a></li>
  <li><a href="http://bazarr.lan" data-port="6767"><b>Bazarr</b><span>Legendas</span></a></li>
  <li><a href="http://prowlarr.lan" data-port="9696"><b>Prowlarr</b><span>Indexadores</span></a></li>
  <li><a href="http://qbittorrent.lan" data-port="8085"><b>qBittorrent</b><span>Downloads</span></a></li>
</ul>
<p class="hint" id="hint"></p>
</main>
<script>
  // Padrão: nomes .lan (Tailscale). Reserva: .local (rede de casa sem Tailscale) ou IP:porta.
  const h = location.hostname;
  if (!h.endsWith('.lan')) {
    for (const a of document.querySelectorAll('a[data-port]'))
      a.href = h.endsWith('.local') ? a.href.replace('.lan', '.local') : `http://${h}:${a.dataset.port}`;
    document.getElementById('hint').textContent = 'Acessando por ' + h + ' — o endereço padrão é http://media.lan';
  }
</script>
<script>
// Fora do .lan/.local (ex.: Windows, localhost ou IP), aponta cada link para host:porta.
(function(){var h=location.hostname;if(/\.(lan|local)$/.test(h)&&h!=='media.local'&&h!=='media.lan')return;
if(/\.(lan|local)$/.test(h))return;
var P={jellyfin:8096,seerr:5055,sonarr:8989,radarr:7878,lidarr:8686,bazarr:6767,prowlarr:9696,qbittorrent:8085};
document.querySelectorAll('a[href]').forEach(function(a){var m=a.getAttribute('href').match(/^http:\/\/([a-z]+)\.lan/);
if(m&&P[m[1]])a.href='http://'+h+':'+P[m[1]]+'/';});})();
</script>
</body>
</html>
